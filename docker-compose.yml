services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sura
      POSTGRES_PASSWORD: sura
      POSTGRES_DB: surashop
    ports:
      - "5432:5432"
    volumes:
      - sura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sura -d surashop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sura_pgdata:
